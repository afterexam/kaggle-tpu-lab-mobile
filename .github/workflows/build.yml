name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate kernel templates
        run: python3 generate_templates.py

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy output APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk kaggle-tpu-lab.apk
          ls -lh kaggle-tpu-lab.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-tpu-lab-apk
          path: kaggle-tpu-lab.apk
          retention-days: 14

      - name: Upload APK to Release (if tagged release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: kaggle-tpu-lab.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
